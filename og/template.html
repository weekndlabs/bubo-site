<!doctype html>
<!-- Source for public/og.png. Render: chrome --headless --screenshot at 1200x630.
     Kept in the repo so the card can be regenerated when the brand changes. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --night: #12141F; --night-2: #1A1D2B; --line: #2A3048;
    --amber: #F5B841; --sage: #6BCC8F; --clay: #E0776F;
    --text: #ECEEF5; --muted: #8A90A6; --faint: #565D75;
    --display: 'Bricolage Grotesque', sans-serif; --mono: 'JetBrains Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: radial-gradient(120% 140% at 18% 30%, #1b2033 0%, var(--night) 55%);
    color: var(--text); font-family: var(--display); overflow: hidden;
    display: grid; grid-template-columns: 1fr 430px; align-items: center;
    padding: 68px; position: relative;
  }
  /* the owl's eyes, watching from the dark */
  .eye { position: absolute; width: 300px; height: 300px; border-radius: 50%;
    background: radial-gradient(circle, rgba(245,184,65,0.18), transparent 62%); filter: blur(4px); }
  .eye.a { top: -40px; left: 300px; } .eye.b { top: -60px; left: 520px; }

  .left { position: relative; z-index: 2; }
  .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 40px; }
  .brand img { width: 52px; height: 52px; border-radius: 13px; }
  .brand span { font-weight: 700; font-size: 26px; }
  .eyebrow { font-family: var(--mono); font-size: 15px; letter-spacing: 0.22em;
    text-transform: uppercase; color: var(--amber); margin-bottom: 20px; }
  h1 { font-size: 68px; line-height: 0.98; font-weight: 800; letter-spacing: -0.02em; max-width: 12ch; }
  .cmd { margin-top: 34px; font-family: var(--mono); font-size: 20px;
    display: inline-flex; align-items: center; gap: 10px;
    background: var(--night-2); border: 1px solid var(--line); border-radius: 12px; padding: 14px 20px; }
  .cmd .p { color: var(--amber); }
  .url { margin-top: 22px; font-family: var(--mono); font-size: 16px; color: var(--faint); }

  /* the panel snippet: the culprit caught red-handed */
  .panel { position: relative; z-index: 2; background: var(--night-2);
    border: 1px solid var(--line); border-radius: 20px; padding: 22px;
    box-shadow: 0 40px 90px -30px rgba(0,0,0,0.75); }
  .p-head { display: flex; align-items: baseline; justify-content: space-between; }
  .p-title { font-weight: 700; font-size: 20px; }
  .p-ver { font-family: var(--mono); font-size: 12px; color: var(--faint); }
  .p-badge { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--amber);
    background: rgba(245,184,65,0.14); padding: 5px 11px; border-radius: 20px; }
  .p-sub { font-family: var(--mono); font-size: 13px; color: var(--faint); margin-top: 4px; }
  .lab { display: flex; justify-content: space-between; align-items: baseline; margin-top: 22px;
    font-family: var(--mono); }
  .lab span { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); }
  .lab b { font-size: 22px; font-weight: 600; }
  .bar { height: 9px; border-radius: 6px; background: #2b3147; margin-top: 9px; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 6px; }
  .sage { color: var(--sage); } .amber { color: var(--amber); } .clay { color: var(--clay); }
  .fill-sage { background: var(--sage); } .fill-amber { background: var(--amber); }
  .apps { margin-top: 22px; font-family: var(--mono); font-size: 15px; }
  .app { display: grid; grid-template-columns: 1fr auto 22px; align-items: center; gap: 12px;
    padding: 8px 10px; border-radius: 8px; }
  .app + .app { margin-top: 2px; }
  .app .x { color: var(--muted); text-align: center; }
  .culprit { background: rgba(224,119,111,0.16); }
  .muted { color: var(--muted); }
</style>
</head>
<body>
  <div class="eye a"></div><div class="eye b"></div>

  <div class="left">
    <div class="brand"><img src="../public/logo.png" alt="" /><span>Bubo</span></div>
    <div class="eyebrow">macOS menu-bar monitor</div>
    <h1>Catch the app slowing your Mac.</h1>
    <div class="cmd"><span class="p">$</span> brew install fajarhide/tap/bubo</div>
    <div class="url">bubo.weekndlabs.com</div>
  </div>

  <div class="panel">
    <div class="p-head">
      <div class="p-title">Bubo <span class="p-ver">1.0</span></div>
      <div class="p-badge">BUSY · RAM 78%</div>
    </div>
    <div class="p-sub">M1 · 8 cores</div>

    <div class="lab"><span>CPU</span><b class="sage">22%</b></div>
    <div class="bar"><i class="fill-sage" style="width:22%"></i></div>

    <div class="lab"><span>Memory</span><b class="amber">6.0 / 8 GB</b></div>
    <div class="bar"><i class="fill-amber" style="width:78%"></i></div>

    <div class="apps">
      <div class="app culprit"><span>Google Chrome</span><span class="clay">128%</span><span class="x">⊗</span></div>
      <div class="app"><span>WindowServer</span><span class="sage">26%</span><span></span></div>
      <div class="app"><span>claude</span><span class="sage">18%</span><span></span></div>
      <div class="app"><span>Orca</span><span class="sage">14%</span><span class="x">⊗</span></div>
    </div>
  </div>
</body>
</html>
